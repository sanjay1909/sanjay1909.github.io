<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Scan to explore Sanjay Krishna Anbalagan's open-source libraries, LinkedIn and writing.">
  <meta property="og:title" content="Connect with Sanjay — QR code">
  <meta property="og:description" content="Scan the QR to explore the libraries and connect with Sanjay.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sanjay1909.github.io/knowme/qrcode/">
  <meta property="og:image" content="https://sanjay1909.github.io/knowme/qrcode/sanjay-links-qr.png">
  <link rel="canonical" href="https://sanjay1909.github.io/knowme/qrcode/">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>Connect with Sanjay — QR code</title>
  <script src="display.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Connect with Sanjay</h1>
      <p>Scan for the libraries, LinkedIn &amp; writing.</p>
    </header>
    <a class="qr-link" href="https://sanjay1909.github.io/knowme/" aria-label="Open Sanjay’s link page">
      <img class="qr" src="sanjay-links-qr.svg" width="1640" height="1640" alt="QR code linking to https://sanjay1909.github.io/knowme/">
    </a>
    <a class="destination" href="https://sanjay1909.github.io/knowme/">sanjay1909.github.io/knowme/</a>
    <nav class="controls" aria-label="QR downloads and display">
      <a href="sanjay-links-qr.png" download="sanjay-links-qr.png">Download PNG</a>
      <a href="sanjay-links-qr.svg" download="sanjay-links-qr.svg">Download SVG</a>
      <button id="fullscreen" type="button" hidden>Full screen</button>
    </nav>
    <p class="status" role="status" id="status"></p>
  </main>
</body>
</html>
