<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Fictional InfoMaps companion: a metadata map and linked document-frequency bars</title>
<desc id="desc">Twenty-four newly authored planning notes plotted by fictional year horizontally and title-plus-text token count vertically. Seven documents matching both bus and housing are highlighted. Bars show selected and whole-corpus document frequencies for six example keywords. Position does not encode semantic similarity or reconstruct the 2012 paper’s layout.</desc>
